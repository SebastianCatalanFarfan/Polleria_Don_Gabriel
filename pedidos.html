<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Pollería Don Gabriel</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin:0; 
            padding:0; 
            background-color:#fff8e1; 
            color:#000000; 
        }
        header { 
            background-color:#000000; 
            color:#FFD700; 
            padding:20px 0; 
            text-align:center; 
            font-size:2em; 
            font-weight:bold; 
        }
        nav { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 10px 50px;
            background-color:#FFD700; 
        }
        nav a { 
            color:#000000; 
            text-decoration:none; 
            margin:0 15px; 
            font-weight:bold; 
            font-size:1.1em; 
        }
        nav a:hover { 
            text-decoration:underline; 
        }
        .nav-center {
            display: flex; 
            justify-content: center; 
            gap: 20px;
        }
        .nav-right {
            display: flex; 
            justify-content: flex-end;
        }
        section { 
            padding:40px 20px; 
            text-align:center; 
        }
        h2 { 
            color:#000000; 
            margin-bottom:20px; 
        }
        .order-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: left;
        }
        .cart-section, .customer-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .item-info {
            flex-grow: 1;
        }
        .item-name {
            font-weight: bold;
            color: #000000;
        }
        .item-price {
            color: #666;
        }
        .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        .quantity-btn {
            background: #FFD700;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
        .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .cart-total {
            font-weight: bold;
            font-size: 1.3em;
            text-align: right;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #000000;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #000000;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #FFD700;
        }
        .delivery-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .delivery-option {
            text-align: center;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .delivery-option.selected {
            border-color: #FFD700;
            background-color: #fff8e1;
        }
        .payment-methods {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .payment-method {
            flex: 1;
            min-width: 100px;
            text-align: center;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .payment-method.selected {
            border-color: #FFD700;
            background-color: #fff8e1;
        }
        .submit-btn {
            background-color: #000000;
            color: #FFD700;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: background-color 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #333333;
        }
        .submit-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .empty-cart {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 40px 0;
        }
        .back-to-menu {
            background-color: #FFD700;
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .order-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>Pollería Don Gabriel</header>
    <nav>
        <div></div>
        <div class="nav-center">
            <a href="index.html">Inicio</a>
            <a href="menu.html">Menú</a>
            <a href="promos.html">Promos</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </div>
        <div class="nav-right">
            <a href="admin-login.html" style="background: #000000; color: #FFD700; padding: 5px 15px; border-radius: 5px; font-size: 0.9em;">Admin</a>
        </div>
    </nav>

    <section>
        <button class="back-to-menu" onclick="window.location.href='menu.html'">← Volver al Menú</button>
        
        <h2>Finalizar Tu Pedido</h2>
        
        <div class="order-container">
            <div class="cart-section">
                <h3>Tu Carrito</h3>
                <div id="carrito"></div>
            </div>
            
            <div class="customer-section">
                <h3>Datos del Pedido</h3>
                <form id="order-form">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefono">Teléfono *</label>
                        <input type="tel" id="telefono" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email">
                    </div>
                    
                    <div class="form-group">
                        <label>Tipo de Entrega</label>
                        <div class="delivery-options">
                            <div class="delivery-option" data-type="delivery">
                                <strong>🚚 Delivery</strong>
                                <p>+S/. 5.00</p>
                            </div>
                            <div class="delivery-option selected" data-type="pickup">
                                <strong>🏪 Recojo en Tienda</strong>
                                <p>Gratis</p>
                            </div>
                        </div>
                    </div>
                    
                    <div id="address-fields" style="display: none;">
                        <div class="form-group">
                            <label for="direccion">Dirección *</label>
                            <input type="text" id="direccion">
                        </div>
                        <div class="form-group">
                            <label for="referencia">Referencia</label>
                            <textarea id="referencia" rows="3"></textarea>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="horario">Horario de Entrega/Recojo</label>
                        <select id="horario">
                            <option value="inmediato">Lo más pronto posible</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="13:00">1:00 PM</option>
                            <option value="14:00">2:00 PM</option>
                            <option value="19:00">7:00 PM</option>
                            <option value="20:00">8:00 PM</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Método de Pago</label>
                        <div class="payment-methods">
                            <div class="payment-method selected" data-method="efectivo">
                                <strong>💵 Efectivo</strong>
                            </div>
                            <div class="payment-method" data-method="tarjeta">
                                <strong>💳 Tarjeta</strong>
                            </div>
                            <div class="payment-method" data-method="yape">
                                <strong>📱 Yape</strong>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="comentarios">Comentarios Adicionales</label>
                        <textarea id="comentarios" rows="3" placeholder="Indicaciones especiales, alergias, etc."></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submit-btn">Confirmar Pedido</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        // CAMBIO IMPORTANTE: Usar Netlify Functions en lugar de Google Apps Script
        const API_BASE = '/.netlify/functions';
        
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        let deliveryType = 'pickup';
        let paymentMethod = 'efectivo';
        let deliveryFee = 0;

        function renderCart() {
            const cartDiv = document.getElementById('carrito');
            cartDiv.innerHTML = '';
            
            if (carrito.length === 0) {
                cartDiv.innerHTML = '<div class="empty-cart">Tu carrito está vacío</div>';
                document.getElementById('submit-btn').disabled = true;
                return;
            }
            
            document.getElementById('submit-btn').disabled = false;
            
            let subtotal = 0;
            carrito.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-name">${item.nombre}</div>
                        <div class="item-price">S/. ${item.precio.toFixed(2)}</div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
                `;
                cartDiv.appendChild(div);
                subtotal += item.precio;
            });
            
            const total = subtotal + deliveryFee;
            
            const totalDiv = document.createElement('div');
            totalDiv.className = 'cart-total';
            totalDiv.innerHTML = `
                <div>Subtotal: S/. ${subtotal.toFixed(2)}</div>
                <div>Delivery: S/. ${deliveryFee.toFixed(2)}</div>
                <div style="font-size: 1.5em; margin-top: 10px;">Total: S/. ${total.toFixed(2)}</div>
            `;
            cartDiv.appendChild(totalDiv);
        }

        function removeFromCart(index) {
            carrito.splice(index, 1);
            localStorage.setItem('carrito', JSON.stringify(carrito));
            renderCart();
        }

        function updateDeliveryFee() {
            deliveryFee = deliveryType === 'delivery' ? 5.00 : 0;
            renderCart();
        }

        // Configurar eventos
        document.querySelectorAll('.delivery-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.delivery-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                deliveryType = this.getAttribute('data-type');
                
                // Mostrar/ocultar campos de dirección
                const addressFields = document.getElementById('address-fields');
                if (deliveryType === 'delivery') {
                    addressFields.style.display = 'block';
                } else {
                    addressFields.style.display = 'none';
                }
                
                updateDeliveryFee();
            });
        });

        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', function() {
                document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
                this.classList.add('selected');
                paymentMethod = this.getAttribute('data-method');
            });
        });

        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            hacerPedido();
        });

        // FUNCIÓN ACTUALIZADA: Usar Netlify Functions
        async function hacerPedido() {
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const email = document.getElementById('email').value;
            const direccion = document.getElementById('direccion').value;
            const referencia = document.getElementById('referencia').value;
            const horario = document.getElementById('horario').value;
            const comentarios = document.getElementById('comentarios').value;

            if (!nombre || !telefono) {
                alert('Por favor completa los campos obligatorios (*)');
                return;
            }

            if (deliveryType === 'delivery' && !direccion) {
                alert('Por favor ingresa tu dirección para el delivery');
                return;
            }

            const pedido = {
                nombre,
                telefono,
                email,
                direccion: deliveryType === 'delivery' ? direccion : 'Recojo en tienda',
                referencia,
                horario,
                comentarios,
                carrito,
                deliveryType,
                paymentMethod,
                deliveryFee,
                total: carrito.reduce((sum, item) => sum + item.precio, 0) + deliveryFee
            };

            try {
                // CAMBIO PRINCIPAL: Usar Netlify Function
                const response = await fetch(`${API_BASE}/save-order-simple`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pedido)
                });

                const result = await response.json();
                
                if (result.success) {
                    alert(`¡Pedido realizado con éxito! Número de pedido: #${result.orderId}`);
                    carrito = [];
                    localStorage.removeItem('carrito');
                    renderCart();
                    document.getElementById('order-form').reset();
                    
                    // Resetear opciones de delivery
                    document.querySelectorAll('.delivery-option').forEach(o => o.classList.remove('selected'));
                    document.querySelector('.delivery-option[data-type="pickup"]').classList.add('selected');
                    deliveryType = 'pickup';
                    document.getElementById('address-fields').style.display = 'none';
                    updateDeliveryFee();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión. Por favor intenta nuevamente.');
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            renderCart();
            updateDeliveryFee();
        });
    </script>
</body>
</html>
